p" data-start="24.47" data-duration="1.237333333333332"><div id="cap-8" class="caption" style="top:230px" data-layout-allow-caption-zone><span class="caption-body">The lid shut.</span></div></div><div id="cap-9-clip" class="clip" data-start="25.827333333333332" data-duration="1.3226666666666667"><div id="cap-9" class="caption" style="top:230px" data-layout-allow-caption-zone><span class="caption-body">Then he saw me.</span></div></div><div id="cap-10-clip" class="clip" data-start="28.883599999999998" data-duration="1.3013333333333321"><div id="cap-10" class="caption" style="top:1760px" data-layout-allow-caption-zone><span class="caption-body">I hit the <em>gas.</em></span></div></div><div id="cap-11-clip" class="clip" data-start="32.9468" data-duration="2.090666666666664"><div id="cap-11" class="caption" style="top:1520px" data-layout-allow-caption-zone><span class="caption-body">Those headlights turned<br>when I did.</span></div></div><div id="cap-12-clip" class="clip" data-start="37.558800000000005" data-duration="1.8346666666666636"><div id="cap-12" class="caption" style="top:1520px" data-layout-allow-caption-zone><span class="caption-body">Every turn. Every street.</span></div></div><div id="cap-13-clip" class="clip" data-start="39.51346666666667" data-duration="1.4293333333333322"><div id="cap-13" class="caption" style="top:1520px" data-layout-allow-caption-zone><span class="caption-body">Still behind me.</span></div></div><div id="cap-14-clip" class="clip" data-start="42.6676" data-duration="1.3866666666666632"><div id="cap-14" class="caption" style="top:1520px" data-layout-allow-caption-zone><span class="caption-body">One last turn.</span></div></div><div id="cap-15-clip" class="clip" data-start="44.17426666666667" data-duration="1.5146666666666633"><div id="cap-15" class="caption" style="top:1520px" data-layout-allow-caption-zone><span class="caption-body">Nothing in the mirror.</span></div></div><div id="cap-16-clip" class="clip" data-start="47.7492" data-d
