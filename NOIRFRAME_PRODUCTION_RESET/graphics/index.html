<!doctype html><html lang="en"><head><meta charset="utf-8"><script src="assets/gsap.min.js"></script><script src="assets/vehicle-state.js"></script><style>*{box-sizing:border-box}html,body{margin:0;background:transparent;font-family:Arial,sans-serif;color:#f3eee4;width:920px;height:300px;overflow:hidden}#panel{position:absolute;inset:5px;border:2px solid #e5a251;border-radius:18px;background:#06131eed;padding:26px 34px}#label{color:#e5a251;font-size:24px;letter-spacing:4px}#value{font-size:65px;font-weight:bold;margin-top:14px;font-variant-numeric:tabular-nums}#detail{font-size:23px;color:#c7d8d8;margin-top:9px}#bar{height:5px;background:#e5a251;margin-top:18px;transform-origin:left}</style></head><body><div id="main" data-composition-id="main" data-start="0" data-duration="5" data-width="920" data-height="300" data-fps="30"><div id="panel" class="clip" data-start="0" data-duration="5" data-track-index="0" data-track-kind="graphics"><div id="label"></div><div id="value"></div><div id="detail"></div><div id="bar"></div></div></div><script>
const mode=new URLSearchParams(location.search).get('mode')||'speed',clock={time:0};
function renderAt(time){let t=Math.max(0,Math.min(4.999,time)),q=NATIVE_VEHICLE[Math.min(149,Math.floor(t*30))],u=t/5;let a,b,c;
if(mode==='speed'){a='VEHICLE · ACTUAL STATE';b=(q.speed_mps*3.6).toFixed(1)+' km/h';c=q.distance_m.toFixed(1)+' m travelled';u=q.speed_mps/7.5}
else if(mode==='clock'){a='STORY CLOCK · DRAFT';b='02:17:'+String(Math.floor(t)).padStart(2,'0');c='AM'}
else if(mode==='pursuit'){a='PURSUIT · PROTOTYPE';b='DISTANCE PENDING';c='Bind to validated full-film vehicle state'}
else if(mode==='phone'){a='UNKNOWN NUMBER';b=t<2?'INCOMING CALL':'CONNECTED';c='Story interface prototype'}
else if(mode==='offer'){a='FOR YOUR SILENCE';b='$'+Math.round(1000000*Math.min(1,t/1.4)).toLocaleString('en-US');c='You have until sunrise.'}
else{a='WHAT WOULD YOU DO?';b='A · TAKE $1,000,000';c='B · CALL THE POLICE'}
label.textContent=a;value.textContent=b;detail.textContent=c;bar.style.transform='scaleX('+u+')';window.__GRAPHICS_STATE={mode,time:t,speed_mps:q.speed_mps,distance_m:q.distance_m};}
const tl=gsap.timeline({paused:true});tl.to(clock,{time:5,duration:5,ease:'none',onUpdate:()=>renderAt(clock.time)});window.__timelines={main:tl};window.addEventListener('hf-seek',e=>renderAt(e.detail.time));renderAt(0);
</script></body></html>
