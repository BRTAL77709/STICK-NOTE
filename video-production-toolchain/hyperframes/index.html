<script>const config=window.SHARED_TIMELINE,clock={time:0};function renderAt(t){const frame=Math.min(config.frames-1,config.hud.startFrame+Math.round(Math.max(0,t)*config.fps)),s=window.FRAME_STATES[frame].state;document.getElementById('speed').textContent=s.speed_kmh.toFixed(1);document.getElementById('distance').textContent=s.distance_m.toFixed(1);document.getElementById('fill').style.transform=`scaleX(${s.speed_mps/7})`;window.__HUD_STATE={globalFrame:frame,speed:s.speed_kmh,distance:s.distance_m};}const tl=gsap.timeline({paused:true});const duration=(config.hud.endFrame-config.hud.startFrame)/config.fps;tl.to(clock,{time:duration,duration,ease:'none',onUpdate:()=>renderAt(clock.time)},0);window.addEventListener('hf-seek',e=>renderAt(e.detail.time));renderAt(0);window.__timelines={main:tl};</script></body></html>
